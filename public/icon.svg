<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12" />
      <stop offset="50%" stop-color="#07070b" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="flareGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Anamorphic Lens Streak -->
  <line x1="20" y1="256" x2="492" y2="256" stroke="url(#flareGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Film Reel Aperture Frame -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1f2438" stroke-width="8" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="148" fill="#0e111a" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Cinematic Clapper / Shutter blades -->
  <path d="M 256 124 L 290 200 L 222 200 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 388 256 L 312 290 L 312 222 Z" fill="url(#cyanGrad)" opacity="0.9" />
  <path d="M 256 388 L 222 312 L 290 312 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 124 256 L 200 222 L 200 290 Z" fill="url(#cyanGrad)" opacity="0.9" />

  <!-- Central Camera Core -->
  <circle cx="256" cy="256" r="64" fill="#07070b" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="256" cy="256" r="46" fill="#151928" />
  
  <!-- Glowing Film Play Core -->
  <polygon points="246,234 278,256 246,278" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Top Cinema Brand Tag -->
  <rect x="180" y="58" width="152" height="28" rx="6" fill="#181824" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="256" y="77" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#fef08a" text-anchor="middle">CINEMATIC AI</text>

  <!-- Title Monogram -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">GS EDIT AI</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="5" fill="#38bdf8" text-anchor="middle">DIRECTOR STUDIO</text>
</svg>
